<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <video
        id="a-roll"
        class="clip"
        src="take-verified.webm"
        muted
        playsinline
        data-duration="3.6"
        data-track-index="0"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"
      ></video>


      <img class="clip" src="final.png" data-start="3.6" data-duration="11.4" data-track-index="1" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#111" alt="État final observé : première tâche terminée" />
      <audio src="narration.m4a" data-start="0" data-duration="13.637914" data-track-index="3" data-volume="1"></audio>
      <div class="clip" data-start="3.6" data-duration="11.4" data-track-index="2" style="position:absolute;bottom:0;left:0;right:0;background:#111;color:white;padding:26px;font-size:34px;text-align:center">État final observé — capture réelle de 3,6 secondes</div>

      <!--
        Add your clips here. Example:
        <div id="title" class="clip" data-start="0" data-duration="5" data-track-index="1"
             style="font-size: 64px; color: #fff; padding: 40px">
          Hello World
        </div>
      -->
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Example: tl.from("#title", { opacity: 0, y: -50, duration: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
