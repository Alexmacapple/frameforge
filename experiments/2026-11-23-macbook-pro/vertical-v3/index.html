<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="9.5"
      data-width="1920"
      data-height="1080"
    >
      
      


      <video id="capture" class="clip" src="capture.webm" muted playsinline data-start="0" data-duration="9.5" data-track-index="0" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#111"></video>

      <audio src="voice1.m4a" data-start="0.9" data-duration="1.820272" data-track-index="3" data-volume="1"></audio>
      <audio src="voice2.m4a" data-start="3.3" data-duration="2.366032" data-track-index="4" data-volume="1"></audio>
      <audio src="voice3.m4a" data-start="5.9" data-duration="2.505079" data-track-index="5" data-volume="1"></audio>
      <div class="clip" data-start="0.9" data-duration="1.9" data-track-index="6" style="position:absolute;bottom:0;width:100%;padding:22px;text-align:center;background:#111;color:white;font-size:38px">Nous ajoutons une première tâche.</div>
      <div class="clip" data-start="3.3" data-duration="2.5" data-track-index="6" style="position:absolute;bottom:0;width:100%;padding:22px;text-align:center;background:#111;color:white;font-size:38px">Nous ajoutons ensuite une deuxième tâche.</div>
      <div class="clip" data-start="5.9" data-duration="2.6" data-track-index="6" style="position:absolute;bottom:0;width:100%;padding:22px;text-align:center;background:#111;color:white;font-size:38px">Enfin, nous terminons la première tâche.</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Example: tl.from("#title", { opacity: 0, y: -50, duration: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
