<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Réservation d'une salle — fixture locale</title>
<style>
body{font:32px Arial,sans-serif;background:#f6f7fa;color:#17212d;margin:0;padding:70px 90px}
main{max-width:1200px;margin:auto;background:white;padding:50px 60px;border:2px solid #ccc;border-radius:20px}
h1{margin:0 0 30px}
fieldset{border:0;margin:0 0 30px;padding:0}
legend{margin-bottom:18px;padding:0}
.rooms{display:flex;gap:24px}
.room{flex:1;font:inherit;padding:26px 20px;background:white;color:#17212d;border:3px solid #333;border-radius:12px;text-align:left}
.room[aria-pressed="true"]{background:#dbe8ff;border-color:#0b57d0;border-width:6px;padding:23px 17px}
.room small{display:block;font-size:24px;margin-top:8px;color:#3a4654}
.option{display:flex;align-items:center;gap:18px;margin:0 0 30px}
.option input{width:40px;height:40px;margin:0}
#book{font:inherit;padding:18px 35px;background:#0b57d0;color:white;border:0;border-radius:8px}
#result{margin:26px 0 0;padding:20px;background:#e0f3e4;display:none}
#result.visible{display:block}
</style></head>
<body><main>
<h1>Réservation d'une salle</h1>
<form id="booking">
<fieldset><legend>Choisir une salle</legend>
<div class="rooms">
<button type="button" class="room" aria-pressed="false" data-room="Salle Cèdre">Salle Cèdre<small>6 places</small></button>
<button type="button" class="room" aria-pressed="false" data-room="Salle Érable">Salle Érable<small>12 places</small></button>
<button type="button" class="room" aria-pressed="false" data-room="Salle Tilleul">Salle Tilleul<small>20 places</small></button>
</div></fieldset>
<label class="option"><input type="checkbox" id="projector" name="projector"> Ajouter un vidéoprojecteur</label>
<button type="submit" id="book">Réserver</button>
</form>
<p id="result" role="status" aria-live="polite"></p>
</main>
<script>
const rooms=[...document.querySelectorAll('.room')];
rooms.forEach(b=>b.addEventListener('click',()=>rooms.forEach(x=>x.setAttribute('aria-pressed',String(x===b)))));
document.querySelector('#booking').addEventListener('submit',e=>{
  e.preventDefault();
  const chosen=rooms.find(x=>x.getAttribute('aria-pressed')==='true');
  const result=document.querySelector('#result');
  if(!chosen){result.textContent='Choisissez une salle avant de réserver.';result.classList.add('visible');return;}
  const option=document.querySelector('#projector').checked?' avec vidéoprojecteur':' sans vidéoprojecteur';
  result.textContent=chosen.dataset.room+' réservée'+option+'.';
  result.classList.add('visible');
});
</script>
</body></html>
