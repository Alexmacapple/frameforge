<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#f6f7fa;color:white;font-family:Arial,sans-serif}#page{position:absolute;left:160px;top:300px;width:600px;height:340px;background:#fff; border-radius:18px;box-shadow:0 4px 18px rgba(17,24,39,.08);padding:44px;color:#111}#page h2{margin:0 0 70px;font-size:40px}.button{position:absolute;display:flex;align-items:center;justify-content:center;font-size:32px; border-radius:10px}#page-button{left:44px;top:190px;width:380px;height:84px;border:2px solid #343a40;color:#111; background:#fff}#backdrop{position:absolute;inset:0;background:#111827;opacity:0}#dialog{position:absolute;left:900px;top:250px;width:820px;height:440px;background:#fff; border-radius:20px;box-shadow:0 20px 50px rgba(17,24,39,.25);padding:48px 60px;color:#111; transform-origin:30% 50%;opacity:0}#dialog h2{margin:0 0 12px;font-size:44px}#dialog p{margin:0;font-size:30px;color:#495057}#cancel{left:60px;top:250px;width:240px;height:88px;border:2px solid #343a40;background:#fff}#delete{left:340px;top:250px;width:280px;height:88px;background:#c92a2a;color:#fff}#loop{position:absolute;left:0;top:0;width:820px;height:440px;overflow:visible}#ring{position:absolute;border:6px solid #f76707;border-radius:16px;pointer-events:none}#key{position:absolute;left:50%;top:90px;min-width:220px;height:104px;padding:0 36px; transform:translateX(-50%);background:#fff;border:3px solid #343a40;border-radius:16px; display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700; color:#111;opacity:0}</style></head><body>

<div id="root" data-composition-id="main" data-start="0" data-duration="12.025" data-width="1920" data-height="1080">
<div id="page"><h2>Supprimer son compte</h2><div id="page-button" class="button">Supprimer mon compte</div></div>
<div id="backdrop"></div>
<div id="dialog"><h2>Supprimer votre compte ?</h2><p>Cette action est définitive.</p><svg id="loop" viewBox="0 0 820 440"><path id="loop-path" fill="none" stroke="#f76707" stroke-width="4" stroke-linecap="round" opacity=".7" d="M 30 294 A 310 78 0 1 0 650 294 A 310 78 0 1 0 30 294"/></svg><div id="cancel" class="button">Annuler</div><div id="delete" class="button">Supprimer</div></div>
<div id="ring"></div>
<div id="key">Tab</div>
<audio id="voice1" src="voice1.wav" data-start="0.4" data-duration="2.875"></audio>
<audio id="voice2" src="voice2.wav" data-start="3.675" data-duration="3.525"></audio>
<audio id="voice3" src="voice3.wav" data-start="7.6" data-duration="3.625"></audio>
<div id="caption1" class="clip" data-start="0.4" data-duration="3.175" style="position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:1680px;width:max-content;background:rgba(17,17,17,.9);color:#fff;text-align:center;padding:18px 36px;border-radius:14px;font-size:42px;line-height:1.3;box-shadow:0 10px 30px rgba(17,24,39,.22)">À l'ouverture, le focus entre dans la fenêtre.</div>
<div id="caption2" class="clip" data-start="3.675" data-duration="3.825" style="position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:1680px;width:max-content;background:rgba(17,17,17,.9);color:#fff;text-align:center;padding:18px 36px;border-radius:14px;font-size:42px;line-height:1.3;box-shadow:0 10px 30px rgba(17,24,39,.22)">Tab le fait tourner entre Annuler et Supprimer, sans en sortir.</div>
<div id="caption3" class="clip" data-start="7.6" data-duration="3.925" style="position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:1680px;width:max-content;background:rgba(17,17,17,.9);color:#fff;text-align:center;padding:18px 36px;border-radius:14px;font-size:42px;line-height:1.3;box-shadow:0 10px 30px rgba(17,24,39,.22)">Échap ferme la fenêtre et rend le focus au bouton de départ.</div>
<script>
(function () {
  const T = [0.4, 3.675, 7.6], D = 12.025;
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  // Léger dépassement à l'arrivée, puis stabilisation.
  const back = (x) => { const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const mix = (a, b, k) => a + (b - a) * k;
  // Position à l'écran, mesurée par rapport à l'image entière, agrandissement de la fenêtre compris.
  const box = (id) => {
    const r = $(id).getBoundingClientRect(), o = $("root").getBoundingClientRect();
    return [r.left - o.left, r.top - o.top, r.width, r.height];
  };
  let cur = 0;

  function ringTo(r, a, b, k) {
    const p = a.map((v, i) => mix(v, b[i], k));
    r.style.left = p[0] - 10 + "px"; r.style.top = p[1] - 10 + "px";
    r.style.width = p[2] + 20 + "px"; r.style.height = p[3] + 20 + "px";
  }

  function at(t) {
    const [s1, s2, s3] = T;
    const page = box("page-button"), cancel = box("cancel"), del = box("delete");
    // Ouverture, puis fermeture de la fenêtre.
    const open = inOut(seg(t, s1 + 0.2, s1 + 1.0)) * (1 - inOut(seg(t, s3 + 0.4, s3 + 1.1)));
    $("dialog").style.opacity = open;
    $("dialog").style.transform = "scale(" + mix(0.9, 1, open) + ")";
    $("backdrop").style.opacity = 0.35 * open;
    // Le focus : bouton de la page, Annuler, Supprimer, Annuler, bouton de la page.
    const legs = [
      [page, cancel, s1 + 0.9, s1 + 1.7],
      [cancel, del, s2 + 0.35, s2 + 0.8],
      [del, cancel, s2 + 1.65, s2 + 2.1],
      [cancel, page, s3 + 0.6, s3 + 1.5],
    ];
    let from = page, to = page, k = 0;
    for (const [a, b, start, end] of legs) {
      if (t >= start) { from = a; to = b; k = t >= end ? 1 : back(seg(t, start, end)); }
    }
    ringTo($("ring"), from, to, k);
    // La touche : Tab pendant la deuxième phrase, Échap pendant la troisième, enfoncée à chaque appui.
    const key = $("key");
    const shown = seg(t, s2 - 0.2, s2) * (1 - seg(t, s3 + 1.4, s3 + 1.8));
    key.style.opacity = shown;
    key.textContent = t < s3 - 0.1 ? "Tab" : "Échap";
    const presses = [s2 + 0.3, s2 + 1.6, s3 + 0.3];
    const down = presses.some((p) => t >= p && t < p + 0.18);
    key.style.transform = "translateX(-50%) scale(" + (down ? 0.92 : 1) + ")";
    key.style.boxShadow = down ? "0 2px 0 #adb5bd" : "0 8px 0 #adb5bd";
    // La boucle sous les deux boutons se dessine pendant les deux appuis sur Tab.
    const loop = $("loop-path"), length = loop.getTotalLength();
    loop.style.strokeDasharray = length;
    loop.style.strokeDashoffset = length * (1 - inOut(seg(t, s2 + 0.4, s2 + 2.2)));
    $("loop").style.opacity = open;
  }

  const timeline = {
    duration: () => D,
    time: () => cur,
    totalTime(t) { if (t === undefined) return cur; cur = t; at(t); return this; },
    seek(t) { if (t === undefined) return cur; cur = t; at(t); return this; },
    progress(p) { if (p === undefined) return cur / D; cur = p * D; at(cur); return this; },
    pause() { return this; },
    play() { return this; },
    timeScale() { return 1; },
  };
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = timeline;
  at(0);
})();
</script>
</div></body></html>
